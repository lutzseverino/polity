spring:
  application:
    name: polity
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/odonta}
    username: ${SPRING_DATASOURCE_USERNAME:odonta}
    password: ${SPRING_DATASOURCE_PASSWORD:odonta}
  flyway:
    table: flyway_schema_history_polity
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration,classpath:db/authorization/publications
    placeholders:
      authorizationSchema: polity_events
  jpa:
    hibernate:
      ddl-auto: validate
  modulith:
    events:
      jdbc:
        schema: polity_events
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${polity.keycloak.base-url}/realms/${polity.keycloak.realm}}
polity:
  api:
    base-path: /api/v1
  membership-invitations:
    accept-url-base: ${POLITY_MEMBERSHIP_INVITATION_ACCEPT_URL_BASE:http://localhost:5173/polities/invitations}
    retry-delay: ${POLITY_MEMBERSHIP_INVITATION_RETRY_DELAY:PT1M}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:odonta}
    client-id: ${KEYCLOAK_POLITY_CLIENT_ID:polity-outbound}
    client-secret: ${KEYCLOAK_POLITY_CLIENT_SECRET:polity-outbound-secret}
    catalog-client-id: ${KEYCLOAK_POLITY_CATALOG_CLIENT_ID:polity}
    catalog-client-secret: ${KEYCLOAK_POLITY_CATALOG_CLIENT_SECRET:polity-catalog-secret}
    realm-admin-client-id: ${KEYCLOAK_POLITY_REALM_ADMIN_CLIENT_ID:polity-realm-admin}
    realm-admin-client-secret: ${KEYCLOAK_POLITY_REALM_ADMIN_CLIENT_SECRET:polity-realm-admin-secret}

cardo:
  billing:
    client:
      base-url: ${BILLING_BASE_URL:http://localhost:8085/api/v1}
      service-token-scope: billing
  identity:
    client:
      base-url: ${IDENTITY_BASE_URL:http://localhost:8081/api/v1}
      service-token-scope: identity
    product-auth:
      # Deliberately defaulted only where a wrong value is inert. The two audiences have no
      # default: Cardo rejects a blank or duplicated audience at startup, so a misconfigured
      # deployment fails closed instead of validating tokens against the wrong client.
      identity-session-audience: ${CARDO_IDENTITY_SESSION_AUDIENCE}
      product-audience: ${CARDO_POLITY_PRODUCT_AUDIENCE}
      session-cookie-name: ${CARDO_SESSION_COOKIE_NAME:cardo.session}
      csrf-cookie-name: ${CARDO_CSRF_COOKIE_NAME:cardo.csrf}
      token-exchange:
        connect-timeout: ${CARDO_PRODUCT_TOKEN_CONNECT_TIMEOUT:PT2S}
        read-timeout: ${CARDO_PRODUCT_TOKEN_READ_TIMEOUT:PT2S}
      active-token-validation:
        enabled: ${CARDO_ACTIVE_TOKEN_VALIDATION_ENABLED:false}
        introspection-uri: ${CARDO_ACTIVE_TOKEN_INTROSPECTION_URI:}
        client-id: ${CARDO_ACTIVE_TOKEN_CLIENT_ID:}
        client-secret: ${CARDO_ACTIVE_TOKEN_CLIENT_SECRET:}
        cache-ttl: ${CARDO_ACTIVE_TOKEN_CACHE_TTL:PT10S}
        cache-max-entries: ${CARDO_ACTIVE_TOKEN_CACHE_MAX_ENTRIES:2048}
        connect-timeout: ${CARDO_ACTIVE_TOKEN_CONNECT_TIMEOUT:PT2S}
        read-timeout: ${CARDO_ACTIVE_TOKEN_READ_TIMEOUT:PT2S}
  invite:
    client:
      base-url: ${INVITE_BASE_URL:http://localhost:8083/api/v1}
      service-token-scope: cardo-invite
server:
  port: ${POLITY_PORT:8084}
  forward-headers-strategy: framework
  shutdown: graceful
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
